name: S&P 500 RSI Monitor

on:
  schedule:
    - cron: "*/15 13-21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rsi-monitor
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run RSI scan
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python rsi_monitor.py

      - name: Commit updated files
        run: |
          git config user.name "rsi-monitor-bot"
          git config user.email "actions@github.com"

          git add GitHubTest.csv rsi_state.json sp500_tickers.json

          if ! git diff --cached --quiet; then
            git commit -m "Update RSI files [skip ci]"
            git pull --rebase origin main
            git push
          else
            echo "No file changes to commit."
          fi
